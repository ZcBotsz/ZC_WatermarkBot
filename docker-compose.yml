services:
  watermark-bot:
    build: .
    container_name: watermark-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data        # SQLite data, bot-token session and persisted settings (keep this folder!)
      - ./work:/work        # temporary files while processing
    # Optional NVIDIA GPU encoding (needs nvidia-container-toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [video, compute, utility] }]
